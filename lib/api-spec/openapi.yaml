openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tickets
    description: Local OCR ticket extraction operations
  - name: years
    description: Year management
  - name: jobs
    description: Job management
  - name: ticket-records
    description: Persisted ticket register rows for a job
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tickets/extract:
    post:
      operationId: extractTicket
      tags: [tickets]
      summary: Extract ticket fields from an image
      description: Runs free local OCR on a ticket image and returns the supported ticket fields plus deterministic waste classification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketExtractionInput"
      responses:
        "200":
          description: Extracted ticket fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketExtraction"
        "400":
          description: Invalid image input
        "422":
          description: No readable text found
        "502":
          description: Local OCR service failed
  /years:
    get:
      operationId: listYears
      tags: [years]
      summary: List all years
      responses:
        "200":
          description: List of years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Year"
    post:
      operationId: createYear
      tags: [years]
      summary: Create a year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateYearInput"
      responses:
        "201":
          description: Created year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Year"
        "409":
          description: Year already exists
  /years/{yearId}:
    delete:
      operationId: deleteYear
      tags: [years]
      summary: Delete a year and all its jobs
      parameters:
        - name: yearId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Year not found
  /years/{yearId}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs for a year
      parameters:
        - name: yearId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "404":
          description: Year not found
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job in a year
      parameters:
        - name: yearId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Year not found
  /years/{yearId}/jobs/{jobId}:
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: yearId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobInput"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: yearId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Job not found
  /jobs/{jobId}/tickets:
    get:
      operationId: listTickets
      tags: [ticket-records]
      summary: List ticket register rows for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of ticket register rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketRecord"
        "404":
          description: Job not found
    post:
      operationId: createTicketRecord
      tags: [ticket-records]
      summary: Add a ticket register row to a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRecordInput"
      responses:
        "201":
          description: Created ticket register row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRecord"
        "404":
          description: Job not found
  /jobs/{jobId}/tickets/{ticketId}:
    patch:
      operationId: updateTicketRecord
      tags: [ticket-records]
      summary: Update fields on a ticket register row
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRecordInput"
      responses:
        "200":
          description: Updated ticket register row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketRecord"
        "404":
          description: Ticket register row not found
    delete:
      operationId: deleteTicketRecord
      tags: [ticket-records]
      summary: Delete a ticket register row
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Ticket register row not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TicketExtractionInput:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
        mediaType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
        imageData:
          type: string
          minLength: 1
          description: Base64-encoded image bytes without a data URL prefix
      required:
        - fileName
        - mediaType
        - imageData
    TicketExtraction:
      type: object
      properties:
        documentType:
          type: string
          enum:
            - ticket
            - invoice
          description: Deterministic document classification.
        vendor:
          type: string
        ticketNumber:
          type: string
        invoiceNumber:
          type: string
        purchaseOrder:
          type: string
        jobNumber:
          type: string
        date:
          type: string
        weight:
          type: string
        amount:
          type: string
        description:
          type: string
        wasteType:
          type: string
          description: Deterministic classification based on the extracted vendor.
      required:
        - documentType
        - vendor
        - ticketNumber
        - invoiceNumber
        - purchaseOrder
        - jobNumber
        - date
        - weight
        - amount
        - description
        - wasteType
    Year:
      type: object
      properties:
        id:
          type: integer
        year:
          type: integer
      required:
        - id
        - year
    CreateYearInput:
      type: object
      properties:
        year:
          type: integer
          minimum: 2000
          maximum: 2100
      required:
        - year
    Job:
      type: object
      properties:
        id:
          type: integer
        yearId:
          type: integer
        jobNumber:
          type: string
        jobName:
          type: string
      required:
        - id
        - yearId
        - jobNumber
        - jobName
    CreateJobInput:
      type: object
      properties:
        jobNumber:
          type: string
          minLength: 1
        jobName:
          type: string
          minLength: 1
      required:
        - jobNumber
        - jobName
    UpdateJobInput:
      type: object
      properties:
        jobNumber:
          type: string
          minLength: 1
        jobName:
          type: string
          minLength: 1
      required:
        - jobNumber
        - jobName
    TicketRecordStatus:
      type: string
      enum:
        - Reading
        - Processed
        - Failed
        - Manual
    TicketRecord:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        fileName:
          type: string
        status:
          $ref: "#/components/schemas/TicketRecordStatus"
        error:
          type: string
          nullable: true
        documentType:
          type: string
        vendor:
          type: string
        ticketNumber:
          type: string
        invoiceNumber:
          type: string
        purchaseOrder:
          type: string
        jobNumber:
          type: string
        date:
          type: string
        weight:
          type: string
        amount:
          type: string
        description:
          type: string
        wasteType:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - jobId
        - fileName
        - status
        - error
        - documentType
        - vendor
        - ticketNumber
        - invoiceNumber
        - purchaseOrder
        - jobNumber
        - date
        - weight
        - amount
        - description
        - wasteType
        - createdAt
    CreateTicketRecordInput:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TicketRecordStatus"
        error:
          type: string
          nullable: true
        documentType:
          type: string
        vendor:
          type: string
        ticketNumber:
          type: string
        invoiceNumber:
          type: string
        purchaseOrder:
          type: string
        jobNumber:
          type: string
        date:
          type: string
        weight:
          type: string
        amount:
          type: string
        description:
          type: string
        wasteType:
          type: string
      required:
        - fileName
        - status
    UpdateTicketRecordInput:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TicketRecordStatus"
        error:
          type: string
          nullable: true
        documentType:
          type: string
        vendor:
          type: string
        ticketNumber:
          type: string
        invoiceNumber:
          type: string
        purchaseOrder:
          type: string
        jobNumber:
          type: string
        date:
          type: string
        weight:
          type: string
        amount:
          type: string
        description:
          type: string
        wasteType:
          type: string
